id = "swap_face"
title = "Swap or Retouch a Face"
description = "Replace or retouch a face in a photo using a second photo as the identity reference. Pass `image` (the photo to edit — may contain several people) and `face_image` (a clear photo of the person whose face should be used), plus a prompt naming WHICH person in `image` to change. The edited photo keeps its original composition, background, body, clothing and lighting; only the named face is rebuilt. Useful for: swapping one person's face for another's, restoring a blurred or badly-lit face from a better shot of the same person, ageing/de-ageing a face from a reference. Works on group photos as long as the prompt identifies the target unambiguously (position, clothing colour, or role)."
output_kind = "image"
output_node_id = "9"
output_filename_prefix = "llmgw-swap-face"

[[params]]
key = "image"
node_id = "41"
input_key = "image"
required = true
description = "The photo to edit — the one containing the person whose face should change. Pass the attachment id EXACTLY as it appears in the conversation — the long `<turn_id>/<filename>` string from the `[attached: id=...]` marker. Copy it verbatim. Composition, background and everything outside the named face are preserved from this image. The model sees it as 'image 1'."

  [params.schema]
  type = "image_attachment"

[[params]]
key = "face_image"
node_id = "83"
input_key = "image"
required = true
description = "Photo of the person whose face should be used as the identity reference. A frontal, sharp, well-lit face at a similar head angle to the target gives by far the best likeness. Pass the attachment id EXACTLY as it appears in the conversation. The model sees it as 'image 2'."

  [params.schema]
  type = "image_attachment"

[[params]]
key = "prompt"
node_id = "170:151"
input_key = "prompt"
required = true
description = "Which face to change, and to what. Always reference 'image 1' and 'image 2' explicitly and identify the target person by something visible — e.g. 'Replace the face of the man on the left in image 1 with the face of the person in image 2, keep his hairstyle, glasses and the original lighting', 'Give the woman in the red dress in image 1 the face from image 2', 'Retouch the blurred face in image 1 using the sharp face in image 2 as reference, keep the original expression'. State what must stay unchanged (hair, expression, head angle, lighting) — the model honours those instructions and it markedly improves the result. Note that hair, beard and glasses from the reference tend to travel with the face even when the prompt asks for the original hairstyle; if the target's hair must survive, say so emphatically ('keep her dark curly hair exactly as it is, change only the facial features') and expect to iterate on the seed."

  [params.schema]
  type = "string"
  max_length = 1500

[[params]]
key = "steps"
node_id = "170:166"
input_key = "value"
description = "Diffusion steps. 40 is the Qwen Image Edit 2511 default and what faces need — identity and skin detail fall apart below ~30. Use 20 only for a quick composition preview."
default = 40

  [params.schema]
  type = "integer"
  min = 4
  max = 60

[[params]]
key = "cfg"
node_id = "170:154"
input_key = "value"
description = "Classifier-free guidance. 4 is the Qwen default. Raise towards 6 when the model ignores the instruction and leaves the original face; lower towards 3 when the result looks over-sharpened or plastic."
default = 4

  [params.schema]
  type = "number"
  min = 0.0
  max = 15.0

[[params]]
key = "seed"
node_id = "170:169"
input_key = "seed"
description = "Random seed. Same images + prompt + seed = same result, so keep a seed when iterating on the prompt and vary it when the likeness just didn't land. -1 = fresh random."
default = -1

  [params.schema]
  type = "integer"
  min = -1
  randomize_on_sentinel = true
