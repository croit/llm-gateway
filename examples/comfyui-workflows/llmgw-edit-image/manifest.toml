id = "edit_image"
title = "Edit Image"
description = "Edit an existing image with a text instruction — change the camera angle, replace the background, restyle it. Uses Flux.2 Klein 9B (base, fp8) in img2img / reference-latent mode. Pass the image_id of an image already in the conversation plus the edit prompt. The edited image is stored in the gateway and rendered inline; do NOT describe it in prose."
output_kind = "image"
output_node_id = "9"
output_filename_prefix = "llmgw-edit-image"

[[params]]
key = "image"
node_id = "76"
input_key = "image"
required = true
description = "The image to edit. Pass the attachment id EXACTLY as it appears in the conversation — the long `<turn_id>/<filename>` string from the `[attached: id=...]` marker of the image you want to edit. Copy it verbatim; do NOT shorten, truncate, or invent an id."

  [params.schema]
  type = "image_attachment"

[[params]]
key = "prompt"
node_id = "75:74"
input_key = "text"
required = true
description = "What to change. Be specific about the desired result, not the change itself ('bright sunny sky with cumulus clouds' beats 'make the sky brighter'). Edit strength comes from how far the prompt pushes from the source."

  [params.schema]
  type = "string"
  max_length = 2000

[[params]]
key = "negative_prompt"
node_id = "75:67"
input_key = "text"
description = "What to avoid ('blurry, low quality, watermark'). Empty = no negative conditioning. Most edits work fine with an empty negative."
default = ""

  [params.schema]
  type = "string"
  max_length = 1000

[[params]]
key = "steps"
node_id = "75:62"
input_key = "steps"
description = "Diffusion steps via the Flux2 scheduler. 20 default for Flux.2 Klein fp8; 30 for higher fidelity. Above 30 rarely helps."
default = 20

  [params.schema]
  type = "integer"
  min = 1
  max = 60

[[params]]
key = "cfg"
node_id = "75:63"
input_key = "cfg"
description = "Classifier-free guidance. How strictly the edit follows the prompt. 5 is the Flux.2 default; higher = more literal but can look overprocessed."
default = 5

  [params.schema]
  type = "number"
  min = 0.0
  max = 15.0

[[params]]
key = "seed"
node_id = "75:73"
input_key = "noise_seed"
description = "Random seed. Same image + prompt + seed = same result. -1 = fresh random each call."
default = -1

  [params.schema]
  type = "integer"
  min = -1
  randomize_on_sentinel = true
